ai: هوش مصنوعی
army_enabled: اعزام تنها بخشی از ارتش تهاجمی
army_enabled_details: به‌طور عادی یک متحد هوش مصنوعی هنگام کمک کردن تمام ارتش تهاجمی خود را می‌فرستد. با روشن بودن این گزینه، تنها سهم مشخص‌شده در زیر را اعزام می‌کند و بقیه را در اردوگاه خود نگه می‌دارد. مدافعان قلعه، گشت‌ها و مهاجمان پراکنده هرگز نمی‌روند. مهندسان، نردبان‌داران، تونل‌کن‌ها و ادوات محاصره در اولویت ماندن در خانه هستند. پس از پایان کمک، نیروهای باقی‌مانده دوباره به ارتش می‌پیوندند.
army_share: سهم ارتش تهاجمی اعزامی (٪)
army_share_tooltip: |-
  با مقدار 75، یک ارتش تهاجمی 40 نفره، 30 نفر را می‌فرستد و 10 نفر را در خانه نگه می‌دارد. نیروهایی که حین کمک سربازگیری می‌شوند نیز به همین نسبت تقسیم می‌شوند.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
diagnostics_group: عیب‌یابی
diagnostics_group_descr: برای آزمایش و عیب‌یابی.
diagnostics_log: ثبت کمک‌های متحدان در گزارش
diagnostics_log_details: هرگاه یک هوش مصنوعی کالا یا طلا بفرستد، کمک به متحدی را آغاز یا متوقف کند، نیروها را در خانه نگه دارد یا دروازه‌ای را برای نیروهای متحد باز کند، یک خط در ucp3.log می‌نویسد — و ماهی یک‌بار نیز خلاصه‌ای از میزان کمک و دریافت هر لرد هوش مصنوعی و وضعیت آن ثبت می‌کند.
gates_enabled: باز کردن دروازه برای نیروهای کمکی
gates_enabled_details: قلعه‌ای که زیر حمله است دروازه‌هایش را بسته نگه می‌دارد و نیروهای کمکی بیرون می‌مانند. با روشن بودن این گزینه، هنگامی که نیروهای کمکی جلوی دروازهٔ قلعهٔ متحد می‌ایستند، دروازه باز می‌شود و به داخل فرستاده می‌شوند (روی دژ مرکزی، زیر را ببینید). پس از اینکه کسی پشت دروازه منتظر نماند، دروازه مانند همیشه خودکار بسته می‌شود. در پایان کمک نیز به همین شکل باز می‌شود تا خارج شوند. این قابلیت برای دروازه‌های خود شما نیز هنگام آمدن متحد هوش مصنوعی کار می‌کند.
gates_keep: استقرار نیروهای کمکی روی دژ مرکزی متحد
gates_keep_details: پس از ورود به قلعه، نیروهای کمکی به بالای دژ مرکزی لرد متحد فرستاده می‌شوند — همان فرمانی که هوش مصنوعی در زمان نگرانی به کمانداران خودش می‌دهد — تا کمانداران و کمانداران زنبورکی از بالا تیراندازی کنند. نیروهایی که بالا جا نداشته باشند اطراف دژ مرکزی می‌ایستند. اگر خاموش باشد، به‌جای آن در اردوگاه لرد گرد می‌آیند.
gold_after_castle: متحدان هوش مصنوعی فقط پس از ساخت کامل قلعه طلا می‌دهند
gold_after_castle_details: یک متحد هوش مصنوعی تمام طلای خود را نگه می‌دارد تا زمانی که قلعه‌اش را تا جایی که زمین اجازه می‌دهد بسازد — همهٔ بخش‌های نقشهٔ قلعه ساخته شده یا مسدود تشخیص داده شده باشد. تنها پس از آن به شما یا متحدان دیگر طلا می‌دهد تا طلای آغازینش صرف ساخت قلعه شود و نتوان آن را درخواست کرد. کالاها تحت تأثیر قرار نمی‌گیرند.
gold_ask: لردهای هوش مصنوعی از متحدانشان طلا درخواست می‌کنند
gold_ask_details: وقتی یک لرد هوش مصنوعی کالایی بخواهد که پول خریدش را ندارد، کسری طلا را از شما و متحدان هوش مصنوعی‌اش درخواست می‌کند (نه بیشتر از آنچه تأخیر درخواست هوش مصنوعی اجازه می‌دهد). این درخواست را مثل بقیهٔ درخواست‌ها در صفحهٔ متحدان می‌بینید و می‌توانید از آنجا طلا بفرستید. متحد هوش مصنوعی در صورتی طلا می‌فرستد که پس از آن حد ذخیرهٔ طلایش حفظ شود (زیر را ببینید)؛ به متحد ضعیف تا نصف مبلغ می‌فرستد و در صورت نیاز تا نصف حد ذخیرهٔ خود پایین می‌آید.
gold_enabled: متحدان هوش مصنوعی ثروتمند طلا می‌فرستند
gold_enabled_details: وقتی یک متحد هوش مصنوعی درخواست کالا می‌کند، لردی که طلای فراوان دارد مقداری طلا نیز همراه آن می‌فرستد — اما فقط اگر درخواست‌کننده طلای کمتری از بخشنده داشته باشد.
gold_group: طلا میان متحدان هوش مصنوعی
gold_group_details: لردهای هوش مصنوعی ثروتمند به متحدانی که از آن‌ها کالا می‌خواهند با طلا نیز کمک می‌کنند.
gold_keep: طلایی که یک لرد همیشه برای خود نگه می‌دارد
gold_keep_tooltip: |-
  لرد هوش مصنوعی هرگز طلایی پایین‌تر از این خط نمی‌بخشد؛ این ذخیره برای ادامهٔ سربازگیری جهت حملهٔ بعدی خودش است. تنها طلای بالاتر از این خط تقسیم می‌شود.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
gold_player: متحدان هوش مصنوعی به شما طلا می‌دهند
gold_player_details: وقتی از یک متحد هوش مصنوعی طلا بخواهید، اگر پس از ارسال دست‌کم حد ذخیرهٔ طلای خود (طلای نگهداری‌شده) را حفظ کند، آن را می‌فرستد. بازی اصلی هرگز به متحد هوش مصنوعی اجازهٔ دادن طلا نمی‌دهد.
gold_recruit: تأمین هزینهٔ سربازگیری متحد ضعیف
gold_recruit_buffer: طلای سربازگیری اضافه بر مقدار خود شخصیت هوش مصنوعی (طلا)
gold_recruit_buffer_tooltip: |-
  طلای سربازگیری یک لرد برابر «آستانهٔ طلای سربازگیری» شخصیت هوش مصنوعی‌اش به علاوهٔ این مقدار است. آن آستانه مقداری است که بازی پیش از خرج کردن ماهانه نزد هوش مصنوعی نگه می‌دارد (اغلب فقط 0 تا 100)؛ این مقدار تقریباً هزینهٔ چند سرباز را به آن می‌افزاید.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
gold_recruit_details: وقتی یک لرد هوش مصنوعی ضعیف یا در معرض تهدید است و طلای کافی برای سربازگیری ندارد، متحدی که وضعیت بهتری دارد کسری آن را می‌فرستد — از طلای مازاد بر خط ذخیرهٔ خود و در چارچوب سهم ماهانه‌اش.
gold_share: سهم طلای مازاد که ارسال می‌شود (٪)
gold_share_tooltip: |-
  با مقدار 25، لردی که خط ذخیره‌اش 1000 و دارایی‌اش 3000 طلاست، 500 طلا می‌فرستد.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
goods_enabled: متحدان هوش مصنوعی برای یکدیگر کالا می‌فرستند
goods_enabled_details: متحد هوش مصنوعی تنها زمانی کالای درخواستی را می‌فرستد که پس از آن حداقل ذخیرهٔ خودش حفظ شود («حداقل کالای نگهداری‌شده پس از تجارت» در شخصیت هوش مصنوعی) — همان قانونی که هنگام درخواست شما اعمال می‌شود. وقتی یک متحد کالا را فرستاد، بقیه دوباره نمی‌فرستند. متحدی که مازاد نداشته باشد فوراً رد می‌کند. پس از برآورده شدن درخواست، درخواست‌کننده به اندازهٔ «تأخیر درخواست هوش مصنوعی» (بر حسب هفتهٔ بازی) صبر می‌کند و پس از رد شدن یک ماه منتظر می‌ماند. لردهای هوش مصنوعی فقط وقتی چیزی نیاز دارند که نتوانند بخرند درخواست می‌دهند. محموله‌ها در آمار کالاهای ارسالی/دریافتی پایان بازی ثبت می‌شود.
goods_give_share: حداکثر سهم هر کالا که یک لرد در ماه می‌بخشد (٪)
goods_give_share_tooltip: |-
  با مقدار 30، لردی که 100 سنگ دارد در کل درخواست‌های یک ماه حداکثر 30 سنگ می‌بخشد. همین قانون برای طلا نیز برقرار است.

  هنگامی به کار می‌رود که شخصیت هوش مصنوعی (AIC) مقدار جداگانه‌ای تعیین نکند.
goods_group: کالا میان متحدان هوش مصنوعی
goods_group_details: لردهای هوش مصنوعی کالاهایی را که نمی‌توانند بخرند از متحدانشان درخواست می‌کنند. به‌طور عادی فقط شما پاسخ می‌دهید؛ با این گزینه، متحدان هوش مصنوعی آن‌ها نیز پاسخ می‌دهند.
goods_no_pingpong: جلوگیری از ردوبدل کردن پی‌درپی کالاها
goods_no_pingpong_details: بدون این گزینه دو متحد ممکن است یک کالا را تا ابد بین خود پاس بدهند. با روشن بودن آن، درخواست انجام‌شده از فهرست خرید درخواست‌کننده خط می‌خورد، هیچ لردی کالایی را که خودش می‌خواهد نمی‌بخشد و کالای دریافتی از متحد تا 3 ماه به دیگری داده نمی‌شود.
goods_protect: فقط متحدان با وضعیت بهتر کمک می‌کنند
goods_protect_details: لردی که ضعیف یا زیر تهدید است چیزی نمی‌بخشد و تنها متحدی که اوضاع بهتری از درخواست‌کننده دارد کمک می‌کند — نخست از بهترین متحد پرسیده می‌شود. هر لرد از هر کالا در ماه حداکثر به اندازهٔ سهم زیر می‌بخشد.
goods_rebuild: کمک به بازسازی ساختمان‌های کلیدی حتی زیر حمله
goods_rebuild_details: لردی که اردوگاه مزدوران، سربازخانه، اسلحه‌خانه، انبار غله یا بازار خود را از دست داده باشد برای دفاع به بازسازی آن نیاز دارد. تا وقتی تعداد یکی از این ساختمان‌ها کمتر از قبل باشد، چوب و سنگ اول از همه به او می‌رسد — حتی زمانی که در معرض تهدید است.
goods_useful: ارسال تنها کالاهای واقعاً مفید
goods_useful_details: دقیقاً مقداری را می‌فرستد که درخواست‌کننده می‌خواهد (بازی دو برابر درخواست می‌کند) و هرگز بیشتر از ظرفیت انبارش نمی‌فرستد — هر مقدار اضافه بر ظرفیت انبار هوش مصنوعی با ضرر فروخته می‌شود. سلاح و غذا در اولویت‌اند؛ چوب، سنگ و سایر مصالح ساختمانی فقط زمانی فرستاده می‌شوند که درخواست‌کننده زیر تهدید نباشد.
goods_weak: متحدان ضعیف دست‌کم نصف مقدار را می‌گیرند
goods_weak_details: وقتی متحد درخواست‌کننده ضعیف است و بخشنده نمی‌تواند کل مقدار را بدهد، تا نصف مقدار درخواستی را می‌فرستد و برای این کار می‌تواند تا نصف حداقل ذخیرهٔ خودش پایین بیاید.
help_enabled: متحدان هوش مصنوعی با نیرو به یکدیگر کمک می‌کنند
help_enabled_details: هنگامی که دشمنان به یک لرد هوش مصنوعی نزدیک شوند، متحدان هوش مصنوعی‌اش ارتش تهاجمی خود را به قلعهٔ او می‌فرستند، دقیقاً مانند وقتی که شما کمک می‌خواهید. یک متحد فقط وقتی می‌آید که خودش زیر تهدید نباشد، مشغول حمله نباشد و به اندازهٔ ارتش لازم برای کمک در شخصیت هوش مصنوعی‌اش رسیده باشد. نیروها دست‌کم تا امن شدن دوبارهٔ قلعه می‌مانند (تنظیم بعدی را ببینید).
help_group: نیرو برای متحدان
help_group_details: لردهای هوش مصنوعی به کمک متحدان هوش مصنوعی خود می‌روند و هنگام کمک به هر کسی — از جمله شما — بخشی از ارتش تهاجمی خود را در خانه نگه می‌دارند.
help_months: حداقل مدت اقامت (ماه)
help_months_tooltip: نیروهای کمکی دست‌کم به این تعداد ماه بازی در قلعهٔ متحد می‌مانند و تا زمانی که خطر پابرجاست بیشتر نیز می‌مانند — مگر اینکه گزینهٔ زیر زودتر آن‌ها را برگرداند. پس از پایان، به قلعهٔ خود بازمی‌گردند.
help_recall: بازگرداندن زودتر نیروهای کمکی هنگامی که
help_recall_army: ارتش خودش آمادهٔ حمله است
help_recall_strong: متحد دوباره احساس قدرت کند
help_recall_tooltip: نیروهای کمکی را حتی پیش از پایان حداقل مدت فوراً به خانه برمی‌گرداند. تا زمانی که دورند، لردشان به کسی حمله نمی‌کند، پس اقامت طولانی حملهٔ خودش را عقب می‌اندازد. گزینهٔ «ارتش خودش آمادهٔ حمله است» به‌محض رسیدن لرد کمک‌کننده به اندازهٔ ارتش مورد نیاز برای حمله (با احتساب نیروهای نزد متحد) آن‌ها را برمی‌گرداند. پس از پایان کمک، لرد 3 ماه یا تا زمان حملهٔ خودش صبر می‌کند و سپس دوباره کمک می‌کند.
