ai: ИИ
army_enabled: Отправлять только часть атакующей армии
army_enabled_details: Обычно союзный ИИ отправляет на помощь всю атакующую армию. С этой опцией он посылает лишь указанную ниже долю, а остальное оставляет в своём лагере. Защитники замка, патрули и налётчики никогда не уходят. Инженеры, лестничники, подкопщики и осадные орудия остаются дома в первую очередь. По окончании помощи оставшиеся войска вновь присоединяются к армии.
army_share: Доля отправляемой атакующей армии (%)
army_share_tooltip: |-
  При значении 75 из атакующей армии в 40 воинов отправляются 30, а 10 остаются дома. Войска, нанятые во время помощи, делятся так же.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
diagnostics_group: Диагностика
diagnostics_group_descr: Для тестирования.
diagnostics_log: Записывать помощь союзников в журнал
diagnostics_log_details: Записывает строку в ucp3.log каждый раз, когда ИИ отправляет товары или золото, начинает или заканчивает помогать союзнику, оставляет войска дома или открывает ворота союзным отрядам — а также раз в месяц сводку о том, сколько каждый лорд ИИ отдал, получил и в каком он состоянии.
gates_enabled: Открывать ворота для союзных подкреплений
gates_enabled_details: Осаждённый замок держит ворота закрытыми, из-за чего подкрепления стоят снаружи. С этой опцией, когда союзные войска подходят к воротам замка, которому помогают, ворота открываются и пропускают их внутрь (на цитадель, см. ниже). Как только у ворот никого не остаётся, они снова закрываются сами, как обычно. Когда помощь заканчивается, ворота так же открываются, чтобы выпустить их. Это работает и для ваших ворот, когда союзный ИИ приходит вам на помощь.
gates_keep: Подкрепления занимают цитадель союзника
gates_keep_details: 'Попав внутрь, союзные войска поднимаются на цитадель лорда, которому помогают — тем же приказом, который ИИ отдаёт своим лучникам в опасности, — чтобы лучники и арбалетчики могли стрелять сверху. Те, кому наверху не хватило места, становятся вокруг цитадели. Если отключено: собираются у лагеря лорда.'
gold_after_castle: Союзники ИИ делятся золотом только после постройки замка
gold_after_castle_details: Союзный ИИ хранит всё своё золото, пока не достроит замок настолько, насколько позволяет местность — все части его плана замка возведены или оказались заблокированы. Лишь после этого он передаёт золото вам или другим союзникам, чтобы стартовое золото шло на замок и его нельзя было выпросить. На товары это не влияет.
gold_ask: Лорды ИИ просят золото у союзников
gold_ask_details: Когда лорду ИИ нужны товары, на которые не хватает денег, он просит у вас и союзных ИИ недостающее золото (не чаще, чем позволяет его задержка запросов ИИ). Вы видите запрос на экране союзников как обычно и можете отправить золото оттуда. Союзный ИИ отправляет золото, если у него после этого остаётся его резерв (см. ниже); слабому союзнику он может отправить до половины суммы, опустившись при необходимости до половины своего резерва.
gold_enabled: Богатые союзники ИИ отправляют золото
gold_enabled_details: Когда союзный ИИ просит товары, лорд с большим запасом золота также отправляет ему немного золота — но только если у просящего золота меньше, чем у дающего.
gold_group: Золото между союзниками ИИ
gold_group_details: Богатые лорды ИИ дополнительно помогают золотом союзникам, просящим товары.
gold_keep: Золото, которое лорд всегда оставляет себе
gold_keep_tooltip: |-
  Лорд ИИ никогда не отдаёт золото ниже этого рубежа — он хранит его для найма войск на следующую атаку. Делится только излишек сверх него.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
gold_player: Союзники ИИ отправляют золото вам
gold_player_details: Когда вы просите золото у союзного ИИ, он отправляет его, если после этого у него остаётся не меньше установленного резерва (Золото, оставляемое себе). В оригинальной игре союзники ИИ никогда не дают золото.
gold_recruit: Оплачивать наём войск слабому союзнику
gold_recruit_buffer: Золото на наём сверх порога персонажа ИИ (золото)
gold_recruit_buffer_tooltip: |-
  Порог золота на наём для лорда равен «порогу золота для найма» из его файла ИИ плюс эта сумма. Этот порог определяет, сколько золота ИИ удерживает перед тратами каждый месяц (часто всего 0–100); надбавка добавляет примерно стоимость нескольких отрядов.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
gold_recruit_details: Когда лорд ИИ ослаблен или под угрозой и не может позволить себе наём войск, более богатый союзник отправляет ему недостающее золото — из запасов выше своего резерва, в пределах месячной доли.
gold_share: Доля отправляемого излишка золота (%)
gold_share_tooltip: |-
  При значении 25 лорд с рубежом 1000 и запасом 3000 отправит 500 золота.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
goods_enabled: Союзники ИИ обмениваются товарами между собой
goods_enabled_details: Союзный ИИ отправляет запрошенный товар только в том случае, если у него после этого остаётся собственный минимум («минимальный запас товаров после торговли» из его файла ИИ) — по тому же правилу, что и для ваших запросов. Как только один союзник отправил товары, остальные уже не шлют. Союзник без лишнего запаса сразу отказывает. После выполненного запроса просящий ждёт свою «задержку запросов ИИ» (в игровых неделях), прежде чем просить снова; после отказа ждёт месяц. Лорды ИИ просят только то, что им нужно и что они не могут купить. Отправленное учитывается в статистике товаров в конце игры.
goods_give_share: Максимум товара, отдаваемый лордом в месяц (%)
goods_give_share_tooltip: |-
  При значении 30 лорд со 100 единицами камня отдаст за месяц не более 30 камня по всем запросам вместе. То же относится и к золоту.

  Используется, если личность ИИ (AIC) не задаёт своё значение.
goods_group: Товары между союзниками ИИ
goods_group_details: Лорды ИИ просят у союзников товары, которые не могут купить. Обычно отвечаете только вы; с этой опцией отвечают и союзные ИИ.
goods_no_pingpong: Не пересылать товары туда-обратно
goods_no_pingpong_details: Без этой опции два союзника могут бесконечно перекидывать друг другу одни и те же товары. С ней выполненный запрос вычёркивается из списка покупок просящего, лорд никогда не отдаёт товар, который нужен ему самому, а полученный от союзника товар не передаётся дальше 3 месяца.
goods_protect: Помогают только более сильные союзники
goods_protect_details: Ослабленный или находящийся под угрозой лорд ничего не отдаёт, и делится только союзник в лучшем положении, чем просящий — самый благополучный опрашивается первым. Каждый лорд отдаёт за месяц не больше указанной ниже доли каждого товара.
goods_rebuild: Помогать отстраивать ключевые здания даже под атакой
goods_rebuild_details: Лорду, потерявшему лагерь наёмников, казарму, оружейную, амбар или рынок, нужно восстановить их, чтобы вообще защищаться. Пока у него меньше этих зданий, чем было, дерево и камень идут ему в первую очередь — даже если он под угрозой.
goods_useful: Отправлять только действительно полезное
goods_useful_details: Отправляет столько, сколько просящему действительно нужно (сама игра запрашивает вдвое больше), и никогда не больше вместимости склада — всё сверх лимита склада ИИ продаётся в убыток. Оружие и еда идут первыми; дерево, камень и стройматериалы — только пока просящий не под угрозой.
goods_weak: Слабые союзники получают хотя бы половину
goods_weak_details: Если просящий союзник ослаблен, а дающий не может выделить полную сумму, он отправляет до половины запрошенного. Ради этого он может опуститься до половины собственного минимума.
help_enabled: Союзники ИИ помогают друг другу войсками
help_enabled_details: Когда враги подступают к лорду ИИ, его союзники ИИ отправляют свои атакующие армии к его замку, как и по вашей просьбе. Союзник приходит только если сам не под угрозой, не занят атакой и накопил армию размера, требуемого его файлом ИИ для помощи. Войска остаются минимум до тех пор, пока замок снова не будет в безопасности (см. следующую настройку).
help_group: Войска для союзников
help_group_details: Лорды ИИ приходят на выручку союзным ИИ и оставляют дома часть атакующей армии, когда помогают кому-либо — включая вас.
help_months: Минимальный срок помощи (месяцев)
help_months_tooltip: Подкрепления остаются у замка союзника не меньше этого числа игровых месяцев и дольше, пока замок в опасности — если настройка ниже не отзовёт их раньше. Завершив помощь, они возвращаются в свой замок.
help_recall: Отзывать подкрепления раньше, когда
help_recall_army: Собственная армия готова к атаке
help_recall_strong: Союзник снова чувствует себя сильным
help_recall_tooltip: Немедленно отзывает подкрепления даже до окончания минимального срока. Пока они в отъезде, их лорд никого не атакует, так что долгое пребывание задерживает его собственную атаку. Вариант «Собственная армия готова к атаке» отзывает их, как только у помогающего лорда наберётся нужный размер армии для атаки (войска у союзника учитываются). После завершения помощи лорд ждёт 3 месяца или до собственной атаки, прежде чем помочь снова.
