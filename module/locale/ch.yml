ai: AI
army_enabled: 仅派出部分进攻主力
army_enabled_details: 原版中，AI 盟友在支援时会派出全部进攻军队。开启后，它只派出下方设定的比例，将其余兵力留在自家营地。城堡守军、巡逻队和劫掠队绝不外派。工程师、云梯兵、隧道工和攻城器械会最先留守。支援结束后，留守部队会重新归队。
army_share: 派出的进攻军队比例（%）
army_share_tooltip: |-
  设为 75 时，40 人的进攻军队会派出 30 人，留 10 人守家。支援期间新招募的士兵按同样比例分配。

  当 AI 个性文件（AIC）未单独指定时生效。
diagnostics_group: 诊断
diagnostics_group_descr: 用于测试和排查问题。
diagnostics_log: 将盟友援助记录写入日志
diagnostics_log_details: 每当 AI 发送物资或金币、开始或结束支援盟友、留守部队，或为友军打开城门时，向 ucp3.log 写入一行记录；并每月汇总一次各 AI 领主的援助、获援及自身状况。
gates_enabled: 为援军打开城门
gates_enabled_details: 受攻的城堡通常会紧闭城门，导致友军援兵被挡在门外。开启后，当友军援兵站在受援城堡城门前时，城门会自动开启并放他们入城（登上主堡，见下文）。门口无人等候后，城门会照常自动关闭。支援结束时，城门也会以同样方式开启放行。当 AI 盟友前来支援你时，此功能同样适用于你的城门。
gates_keep: 援军登上盟友主堡
gates_keep_details: 入城后，援军会被派上受援领主的主堡顶端——与 AI 紧张时给自家弓箭手下达的命令相同——以便弓箭手和弩手居高临下射击。主堡顶上站不下的单位会在主堡周围待命。关闭时，援军改为在领主营地集合。
gold_after_castle: AI 盟友在城堡建成后才赠送金币
gold_after_castle_details: AI 盟友会保留所有金币，直到按地形条件把城堡建完——城堡规划中的每一处都已建好或确认被阻挡。此后它才会向你或其他盟友赠送金币，以免起始资金被要走而无法建城。物资不受影响。
gold_ask: AI 领主向盟友请求金币
gold_ask_details: 当 AI 领主需要购买无力负担的物资时，它会向你和 AI 盟友请求所缺金币（频率不超过其 AI 请求间隔）。你会在盟友界面中看到该请求，并可像其他请求一样直接寄送金币。AI 盟友会在寄出后仍能保留自身金币底线（见下文）时提供援助；面对弱势盟友时最多支援一半，必要时可降至底线的一半。
gold_enabled: 富裕的 AI 盟友附带赠送金币
gold_enabled_details: 当 AI 盟友请求物资时，拥有大量金币的领主也会顺带赠送一些金币——但前提是请求方的金币少于赠送方。
gold_group: AI 盟友间的金币援助
gold_group_details: 富裕的 AI 领主也会用金币帮助向其请求物资的盟友。
gold_keep: 领主始终自留的金币底线
gold_keep_tooltip: |-
  AI 领主绝不会把金币赠至该底线以下，这部分留作自身下一次进攻的招募资金，只有超出部分才会共享。

  当 AI 个性文件（AIC）未单独指定时生效。
gold_player: AI 盟友向你赠送金币
gold_player_details: 当你向 AI 盟友请求金币时，只要它在送出后仍保留至少自身的金币底线（自留金币），就会把金币寄给你。原版游戏中 AI 盟友从不向玩家赠送金币。
gold_recruit: 资助弱势盟友招募士兵
gold_recruit_buffer: 在 AI 角色自身门槛之上额外增加的招募资金（金币）
gold_recruit_buffer_tooltip: |-
  领主的招募资金等于其 AI 角色的「招募金币门槛」加上该数值。游戏原版会让 AI 每月消费前保留该门槛（往往只有 0–100）；该额外值大约补足招募一小批士兵的费用。

  当 AI 个性文件（AIC）未单独指定时生效。
gold_recruit_details: 当某个 AI 领主处于弱势或受威胁状态且无钱招兵时，境况更好的盟友会从其底线之上的金币中，在月度限额内补足它所缺的招募资金。
gold_share: 超出底线部分的赠送比例（%）
gold_share_tooltip: |-
  设为 25 时，底线为 1000 且持有 3000 金币的领主会送出 500 金币。

  当 AI 个性文件（AIC）未单独指定时生效。
goods_enabled: AI 盟友互相运送物资
goods_enabled_details: AI 盟友只有在送出后仍保有自身最低库存（其 AI 角色的「交易后保留最低物资」）时才会响应请求，与回应玩家请求的规则完全相同。只要有一名盟友送出物资，其他盟友便不会重复发送；无力支援的盟友会立刻拒绝。请求满足后，请求方需等待其 AI 角色的「AI 请求间隔」（按游戏周计算）才会再次请求；遭拒后则等待一个月。AI 领主只在急需且无力购买时才会求助，送出的物资会计入终局的物资收发统计。
goods_give_share: 每位领主每月最多赠出单项物资的比例（%）
goods_give_share_tooltip: |-
  设为 30 时，拥有 100 块石头的领主每月响应所有请求合计最多送出 30 块石头。金币同样受此限制。

  当 AI 个性文件（AIC）未单独指定时生效。
goods_group: AI 盟友间的物资援助
goods_group_details: AI 领主会向盟友请求自己买不起的物资。原版中只有玩家会回应；开启后，它们的 AI 盟友也会回应。
goods_no_pingpong: 禁止来回互传物资
goods_no_pingpong_details: 关闭时，两名盟友可能会把同一批物资无限来回互传。开启后，已满足的请求会从采购清单划掉，领主绝不会送出自己正在求购的物资，且从盟友处收到的物资 3 个月内不会再转送出去。
goods_protect: 仅由境况更好的盟友提供援助
goods_protect_details: 受威胁或处于弱势的领主不会对外赠送任何物资，只有境况好于请求方的盟友才会施援——且优先向最富裕的盟友求助。每位领主每月对每种物资的赠出量不超过下方比例。
goods_rebuild: 受攻期间也优先援助重建关键建筑
goods_rebuild_details: 失去雇佣兵营地、兵营、军械库、粮仓或市场的领主必须尽快重建才能组织防御。只要其中任一建筑数量少于此前，木材和石料都会优先送达该领主——即使它正处于威胁之下。
goods_useful: 仅发送真正有用的物资
goods_useful_details: 只发送请求方真正需要的数量（游戏本身会按两倍请求），且绝不超过对方的储藏上限——超出 AI 储藏上限的部分会被低价抛售。武器和食物优先发送；木材、石料等建材仅在请求方未受威胁时发送。
goods_weak: 弱势盟友至少获得一半援助
goods_weak_details: 当请求的盟友处于弱势且援助方无法拿出全额时，仍会送出最多一半请求量，为此最多可动用到自身最低库存的一半。
help_enabled: AI 盟友互相派兵支援
help_enabled_details: 当敌军逼近某位 AI 领主时，其 AI 盟友会派出进攻军队驰援它的城堡，就像响应你的求援一样。盟友只有在自身未受威胁、未在进攻中且兵力达到其 AI 角色设定的支援门槛时才会出兵。援军至少会留守至城堡恢复安全（见下项设置）。
help_group: 盟友兵力支援
help_group_details: AI 领主会驰援遇险的 AI 盟友，并在援助任何人（包括玩家）时将部分进攻兵力留守家中。
help_months: 最短支援时长（月）
help_months_tooltip: 援军至少在盟友城堡驻守这么多游戏月，若城堡仍处危险中则会继续留守——除非下方设置提前召回。任务结束后，他们会返回各自城堡。
help_recall: 在以下情况提前召回援军
help_recall_army: 自身军队已准备好进攻
help_recall_strong: 盟友重新恢复强势
help_recall_tooltip: 即使最短支援时长未满也会立即召回援军。援军在外期间其领主不会主动进攻，因此驻守过久会拖延自身攻势。选择「自身军队已准备好进攻」后，只要援助领主攒够出兵所需兵力（含在外援军），就会立即召回。每次支援结束后，领主需等待 3 个月（或发动一次自身进攻）才会再次出兵援助。
improvements: 改进
misc: 其他
