options:
- display: GroupBox
  category: [Ally Support]
  header: '{{goods_group}}'
  text: '{{goods_group_descr}}'
  hasHeader: true
  children:
  - url: ally-support.goods.enabled
    name: ally-support-goods-enabled
    text: '{{goods_enabled}}'
    tooltip: '{{goods_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.weak
    name: ally-support-goods-weak
    text: '{{goods_weak}}'
    tooltip: '{{goods_weak_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.no_pingpong
    name: ally-support-goods-no-pingpong
    text: '{{goods_no_pingpong}}'
    tooltip: '{{goods_no_pingpong_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.useful
    name: ally-support-goods-useful
    text: '{{goods_useful}}'
    tooltip: '{{goods_useful_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.protect
    name: ally-support-goods-protect
    text: '{{goods_protect}}'
    tooltip: '{{goods_protect_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.rebuild
    name: ally-support-goods-rebuild
    text: '{{goods_rebuild}}'
    tooltip: '{{goods_rebuild_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.goods.give_share
    name: ally-support-goods-give-share
    text: '{{goods_give_share}}'
    tooltip: '{{goods_give_share_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 30
      min: 5
      max: 100
      step: 5

- display: GroupBox
  category: [Ally Support]
  header: '{{gold_group}}'
  text: '{{gold_group_descr}}'
  hasHeader: true
  children:
  - url: ally-support.gold.enabled
    name: ally-support-gold-enabled
    text: '{{gold_enabled}}'
    tooltip: '{{gold_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.gold.ask
    name: ally-support-gold-ask
    text: '{{gold_ask}}'
    tooltip: '{{gold_ask_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.gold.line
    name: ally-support-gold-line
    text: '{{gold_line}}'
    tooltip: '{{gold_line_tooltip}}'
    display: Choice
    contents:
      type: string
      value: recruit
      choices:
      - name: recruit
        text: '{{gold_line_recruit}}'
      - name: rich
        text: '{{gold_line_rich}}'
  - url: ally-support.gold.recruit
    name: ally-support-gold-recruit
    text: '{{gold_recruit}}'
    tooltip: '{{gold_recruit_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.gold.recruit_buffer
    name: ally-support-gold-recruit-buffer
    text: '{{gold_recruit_buffer}}'
    tooltip: '{{gold_recruit_buffer_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 300
      min: 0
      max: 2000
      step: 50
  - url: ally-support.gold.factor
    name: ally-support-gold-factor
    text: '{{gold_factor}}'
    tooltip: '{{gold_factor_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 100
      min: 1
      max: 1000
      step: 10
  - url: ally-support.gold.share
    name: ally-support-gold-share
    text: '{{gold_share}}'
    tooltip: '{{gold_share_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 25
      min: 5
      max: 100
      step: 5

- display: GroupBox
  category: [Ally Support]
  header: '{{help_group}}'
  text: '{{help_group_descr}}'
