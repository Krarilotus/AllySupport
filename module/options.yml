options:
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{goods_group}}'
  text: '{{goods_group_details}}'
  hasHeader: true
  children:
  - url: ally-support.goods.enabled
    name: ally-support-goods-enabled
    text: '{{goods_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_enabled}}'
  - url: ally-support.goods.weak
    name: ally-support-goods-weak
    text: '{{goods_weak_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_weak}}'
  - url: ally-support.goods.no_pingpong
    name: ally-support-goods-no-pingpong
    text: '{{goods_no_pingpong_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_no_pingpong}}'
  - url: ally-support.goods.useful
    name: ally-support-goods-useful
    text: '{{goods_useful_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_useful}}'
  - url: ally-support.goods.protect
    name: ally-support-goods-protect
    text: '{{goods_protect_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_protect}}'
  - url: ally-support.goods.rebuild
    name: ally-support-goods-rebuild
    text: '{{goods_rebuild_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{goods_rebuild}}'
  - url: ally-support.goods.give_share
    name: ally-support-goods-give-share
    text: '{{goods_give_share}}'
    display: Number
    contents:
      type: integer
      value: 30
      min: 5
      max: 100
      step: 5
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{gold_group}}'
  text: '{{gold_group_details}}'
  hasHeader: true
  children:
  - url: ally-support.gold.enabled
    name: ally-support-gold-enabled
    text: '{{gold_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gold_enabled}}'
  - url: ally-support.gold.ask
    name: ally-support-gold-ask
    text: '{{gold_ask_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gold_ask}}'
  - url: ally-support.gold.recruit
    name: ally-support-gold-recruit
    text: '{{gold_recruit_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gold_recruit}}'
  - url: ally-support.gold.player
    name: ally-support-gold-player
    text: '{{gold_player_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gold_player}}'
  - url: ally-support.gold.after_castle
    name: ally-support-gold-after-castle
    text: '{{gold_after_castle_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gold_after_castle}}'
  - url: ally-support.gold.recruit_buffer
    name: ally-support-gold-recruit-buffer
    text: '{{gold_recruit_buffer}}'
    display: Number
    contents:
      type: integer
      value: 300
      min: 0
      max: 2000
      step: 50
  - url: ally-support.gold.keep
    name: ally-support-gold-keep
    text: '{{gold_keep}}'
    display: Number
    contents:
      type: integer
      value: 1000
      min: 0
      max: 10000
      step: 100
  - url: ally-support.gold.share
    name: ally-support-gold-share
    text: '{{gold_share}}'
    display: Number
    contents:
      type: integer
      value: 25
      min: 5
      max: 100
      step: 5
- display: GroupBox
  category:
  - '{{ai}}'
  - '{{improvements}}'
  header: '{{help_group}}'
  text: '{{help_group_details}}'
  hasHeader: true
  children:
  - url: ally-support.help.enabled
    name: ally-support-help-enabled
    text: '{{help_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{help_enabled}}'
  - url: ally-support.help.months
    name: ally-support-help-months
    text: '{{help_months}}'
    display: Number
    contents:
      type: integer
      value: 6
      min: 0
      max: 24
      step: 1
  - url: ally-support.help.recall
    name: ally-support-help-recall
    text: '{{help_recall}}'
    display: Choice
    contents:
      type: string
      value: strong
      choices:
      - name: strong
        text: '{{help_recall_strong}}'
      - name: army
        text: '{{help_recall_army}}'
  - url: ally-support.army.enabled
    name: ally-support-army-enabled
    text: '{{army_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{army_enabled}}'
  - url: ally-support.army.share
    name: ally-support-army-share
    text: '{{army_share}}'
    display: Number
    contents:
      type: integer
      value: 75
      min: 5
      max: 100
      step: 5
  - url: ally-support.gates.enabled
    name: ally-support-gates-enabled
    text: '{{gates_enabled_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gates_enabled}}'
  - url: ally-support.gates.keep
    name: ally-support-gates-keep
    text: '{{gates_keep_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: true
    header: '{{gates_keep}}'
- display: GroupBox
  category:
  - '{{misc}}'
  header: '{{diagnostics_group}}'
  text: '{{diagnostics_group_descr}}'
  hasHeader: true
  children:
  - url: ally-support.diagnostics.log
    name: ally-support-diagnostics-log
    text: '{{diagnostics_log_details}}'
    display: UCP2Switch
    contents:
      type: boolean
      value: false
    header: '{{diagnostics_log}}'
meta:
  version: 1.0.0
