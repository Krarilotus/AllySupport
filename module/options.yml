    tooltip: '{{army_share_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 75
      min: 5
      max: 100
      step: 5
  - url: ally-support.gates.enabled
    name: ally-support-gates-enabled
    text: '{{gates_enabled}}'
    tooltip: '{{gates_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: ally-support.gates.keep
    name: ally-support-gates-keep
    text: '{{gates_keep}}'
    tooltip: '{{gates_keep_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true

- display: GroupBox
  category: [Ally Support]
  header: '{{diagnostics_group}}'
  text: '{{diagnostics_group_descr}}'
  hasHeader: true
  children:
  - url: ally-support.diagnostics.log
    name: ally-support-diagnostics-log
